name: ci
on:
  pull_request:
  push:
    branches:
      - main
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    runs-on: ubuntu-latest
    env:
      CC: ${{ matrix.cc }}
    steps:
      - uses: actions/checkout@v4

      - name: Build (${{ matrix.cc }}) + render_test
        run: |
          "$CC" mate.c -o mate
          ./mate

      - name: Smoke test
        run: |
          sudo sysctl -w kernel.perf_event_paranoid=1 || true
          BIN=$(find build/bin -name poopc -type f | head -1)
          "$BIN" -h
          "$BIN" --color never -d 300 'true' 'sleep 0.01'

      - name: Archive executable
        uses: actions/upload-artifact@v4
        with:
          name: poopc-${{ matrix.cc }}
          path: build/bin/*/poopc
